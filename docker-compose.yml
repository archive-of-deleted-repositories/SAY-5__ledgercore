services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledgercore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgercore"]
      interval: 2s
      timeout: 2s
      retries: 20
  ledger:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEDGERCORE_PG_URL: "postgresql://ledger:ledger@postgres:5432/ledgercore"
      LEDGERCORE_WAL_PATH: /var/lib/ledgercore/wal
      LEDGERCORE_LISTEN: "0.0.0.0:50051"
    ports:
      - "50051:50051"
    volumes:
      - ledger-wal:/var/lib/ledgercore
volumes:
  ledger-wal: {}
